services:
  fiora-bot:
    image: ghcr.io/ichinose520122/fiora-bot:latest
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-3220}:3220"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/app/data
      - ./plugins:/app/plugins
      - ./skills:/app/skills
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
