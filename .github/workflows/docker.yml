name: Test and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fiora-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          tags: |
            ghcr.io/ichinose520122/fiora-bot:latest
            ghcr.io/ichinose520122/fiora-bot:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check host bind mounts, startup, persistence and graceful shutdown
        run: |
          image=ghcr.io/ichinose520122/fiora-bot:latest
          docker run --rm --entrypoint node "$image" -e "if (process.env.FIORA_BOT_RUNTIME !== 'docker') throw new Error('Missing Docker runtime metadata'); console.log(process.version)"
          deploy="$RUNNER_TEMP/fiora-bot-smoke"
          mkdir -p "$deploy/scripts"
          cp compose.yaml "$deploy/compose.yaml"
          cp scripts/prepare-docker.sh "$deploy/scripts/prepare-docker.sh"
          sudo sh "$deploy/scripts/prepare-docker.sh"
          docker compose -p fiora-bot-smoke -f "$deploy/compose.yaml" config --quiet
          for pass in 1 2; do
            docker compose -p fiora-bot-smoke -f "$deploy/compose.yaml" up -d --no-build --pull never
            container=fiora-bot-smoke-fiora-bot-1
            ready=false
            for attempt in $(seq 1 30); do
              if docker exec "$container" node scripts/healthcheck.mjs; then ready=true; break; fi
              sleep 1
            done
            test "$ready" = true
            test "$(docker inspect --format '{{(index (index .HostConfig.PortBindings "3220/tcp") 0).HostIp}}' "$container")" = 127.0.0.1
            docker exec "$container" node -e "const fs=require('fs'); for(const p of ['/app/data','/app/plugins','/app/skills'])fs.accessSync(p,fs.constants.W_OK); if(!fs.existsSync('/app/plugins/extension-manager/plugin.json')||!fs.existsSync('/app/skills/whale-memes/skill.json'))process.exit(1);"
            if [ "$pass" = 1 ]; then
              docker exec "$container" node -e "const fs=require('fs'),p='/app/data/config.json',c=JSON.parse(fs.readFileSync(p)); if(c.api.apiKey||c.api.model||c.api.baseUrl)process.exit(1); c.smokeMarker='persistent'; fs.writeFileSync(p,JSON.stringify(c));"
            else
              docker exec "$container" node -e "const c=require('/app/data/config.json'); if(c.smokeMarker!=='persistent')process.exit(1);"
            fi
            docker stop --time 30 "$container"
            test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0
            docker compose -p fiora-bot-smoke -f "$deploy/compose.yaml" rm -f
          done
      - name: Publish verified image
        run: |
          docker push ghcr.io/ichinose520122/fiora-bot:latest
          docker push ghcr.io/ichinose520122/fiora-bot:sha-${{ github.sha }}
      - name: Show container logs on failure
        if: failure()
        run: docker logs fiora-bot-smoke-fiora-bot-1 || true
      - name: Clean up smoke test
        if: always()
        run: |
          docker compose -p fiora-bot-smoke -f "$RUNNER_TEMP/fiora-bot-smoke/compose.yaml" down || true
