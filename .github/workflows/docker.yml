name: Test and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fiora-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          tags: |
            ghcr.io/ichinose520122/fiora-bot:latest
            ghcr.io/ichinose520122/fiora-bot:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check startup, persistent configuration and graceful shutdown
        run: |
          image=ghcr.io/ichinose520122/fiora-bot:latest
          docker run --rm --entrypoint node "$image" -p 'process.version'
          docker volume create fiora-bot-smoke-data
          for pass in 1 2; do
            docker run -d --name fiora-bot-smoke -v fiora-bot-smoke-data:/app/data -p 127.0.0.1:3220:3220 "$image"
            ready=false
            for attempt in $(seq 1 30); do
              if docker exec fiora-bot-smoke node scripts/healthcheck.mjs; then ready=true; break; fi
              sleep 1
            done
            test "$ready" = true
            if [ "$pass" = 1 ]; then
              docker exec fiora-bot-smoke node -e "const fs=require('fs'),p='/app/data/config.json',c=JSON.parse(fs.readFileSync(p)); c.smokeMarker='persistent'; fs.writeFileSync(p,JSON.stringify(c));"
            else
              docker exec fiora-bot-smoke node -e "const c=require('/app/data/config.json'); if(c.smokeMarker!=='persistent')process.exit(1);"
            fi
            docker stop --time 30 fiora-bot-smoke
            test "$(docker inspect --format '{{.State.ExitCode}}' fiora-bot-smoke)" = 0
            docker rm fiora-bot-smoke
          done
      - name: Publish verified image
        run: |
          docker push ghcr.io/ichinose520122/fiora-bot:latest
          docker push ghcr.io/ichinose520122/fiora-bot:sha-${{ github.sha }}
      - name: Show container logs on failure
        if: failure()
        run: docker logs fiora-bot-smoke || true
      - name: Clean up smoke test
        if: always()
        run: |
          docker rm -f fiora-bot-smoke || true
          docker volume rm fiora-bot-smoke-data || true
